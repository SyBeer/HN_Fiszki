services:
  fiszki-hiszpanski:
    build: .
    image: fiszki-hiszpanski:latest
    container_name: fiszki-hiszpanski
    restart: unless-stopped
    depends_on:
      - results
    ports:
      - "8085:80"

  results:
    build:
      context: .
      dockerfile: results/Dockerfile
    image: fiszki-hiszpanski-results:latest
    container_name: fiszki-hiszpanski-results
    restart: unless-stopped
    # ADMIN_TOKEN w pliku .env obok tego pliku (nie trafia do repo)
    env_file:
      - path: .env
        required: false
    volumes:
      # wyniki uczniów (SQLite), przeżywają przebudowę kontenera
      - results-data:/data

volumes:
  results-data:
