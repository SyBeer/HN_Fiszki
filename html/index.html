<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2747c9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fiszki ES">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">

<title>Fiszki Arriba Joven</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Lexend:wght@400;500;700&family=Caveat:wght@500;700&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: karta-fiszka z papieru (zawsze jasna jak kartka z zeszytu) na chłodnym tle; polskie tłumaczenie "długopisem" jak notatki w podręczniku */
:root {
  --bg: #eceff5;
  --fg: #1b1e27;
  --muted: #5b6275;
  --surface: #ffffff;
  --line: #d3d8e3;
  --accent: #2747c9;
  --accent-fg: #ffffff;
  --good: #1d7f55;
  --bad: #b93b34;
  --shadow: 0 1px 2px rgb(20 30 60 / .08), 0 8px 24px rgb(20 30 60 / .10);

  /* kartka i rysunek - te same w obu motywach, bo to "papier" */
  --plate: #fbfaf5;
  --plate-line: #e4e1d6;
  --pi: #24262c;
  --pen: #2340b8;
  --cl: #ffffff;
  --cl2: #c9d3ea;
  --pants: #4a5266;
  --skin: #f4d9c3;
  --eye-white: #ffffff;
  --h-black: #2e2b2a;
  --h-brown: #7b4a2a;
  --h-blond: #ecc768;
  --h-grey: #d2d2d2;
  --h-red: #c9542c;
  --h-dyed: #6c5ce0;
  --e-light: #9fc3dd;
  --e-dark: #3a2618;
  --e-blue: #3f8fd6;
  --e-green: #3aa257;
  --e-grey: #9aa1a8;
  --e-brown: #8a5228;
  --denim: #6f8fc2;
  --gold: #f0b93a;
  --red: #dc4a3e;
  --pink: #f4a3b4;

  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Lexend", "Segoe UI", system-ui, sans-serif;
  --f-pen: "Caveat", "Bradley Hand", "Segoe Print", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161b; --fg: #e7e9ef; --muted: #9aa1b3; --surface: #1f2229; --line: #343846;
    --accent: #8fa3ff; --accent-fg: #10142a; --good: #4cc490; --bad: #f07d74;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 10px 30px rgb(0 0 0 / .45);
    --plate: #efece2; --plate-line: #d9d5c8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14161b; --fg: #e7e9ef; --muted: #9aa1b3; --surface: #1f2229; --line: #343846;
  --accent: #8fa3ff; --accent-fg: #10142a; --good: #4cc490; --bad: #f07d74;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 10px 30px rgb(0 0 0 / .45);
  --plate: #efece2; --plate-line: #d9d5c8;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 28px;
}
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 18px; }

header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(28px, 6vw, 40px); line-height: 1; margin: 0; letter-spacing: -.02em; text-wrap: balance; }
h1 .pen { font-family: var(--f-pen); color: var(--accent); font-weight: 700; letter-spacing: 0; font-size: .9em; margin-left: .15em; }
.sub { color: var(--muted); font-size: 13px; margin: 6px 0 0; }

.decks { display: flex; flex-wrap: wrap; gap: 8px; }
.deck {
  font: 500 14px/1 var(--f-body); color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
  padding: 9px 14px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center;
}
.deck small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.deck[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.deck[aria-pressed="true"] small { color: inherit; opacity: .7; }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.seg-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 6px; }
.seg button {
  font: 500 13px/1 var(--f-body); color: var(--muted); background: transparent; border: 0;
  padding: 8px 11px; border-radius: 7px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.grp { display: inline-flex; align-items: center; }
.btn {
  font: 500 14px/1 var(--f-body); border-radius: 10px; padding: 11px 16px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  display: inline-flex; align-items: center; gap: 8px; justify-content: center;
}
.btn:hover { border-color: var(--muted); }
button:focus-visible, .card:focus-visible, .tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.stat { margin-left: auto; color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; }
.meter { width: 90px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--good); }
.link { font: 500 13px/1 var(--f-body); color: var(--accent); background: none; border: 0; padding: 6px 4px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.link.danger { color: var(--bad); }
.confirm { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; color: var(--fg); }

/* ---- karta ---- */
.stage { display: grid; justify-items: center; gap: 16px; }
.card, .tile { container-type: inline-size; perspective: 1200px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.card { width: min(100%, 360px); aspect-ratio: 4 / 5; max-width: 100%; }
.inner { position: relative; width: 100%; height: 100%; transition: transform .5s cubic-bezier(.3,.7,.3,1); transform-style: preserve-3d; }
.flipped .inner { transform: rotateY(180deg); }
.side {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--plate); color: var(--pi); border-radius: 16px; box-shadow: var(--shadow);
  border: 1px solid var(--plate-line);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4cqi;
  padding: 7cqi; text-align: center; overflow: hidden;
  background-image: repeating-linear-gradient(to bottom, transparent 0 calc(10cqi - 1px), var(--plate-line) calc(10cqi - 1px) 10cqi);
  background-position: 0 6cqi;
}
.side.back { transform: rotateY(180deg); }
.side.pic { background-image: none; }
.ill { width: 100%; flex: 1 1 auto; min-height: 0; position: relative; }
.ill svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.side.back .ill { flex: 0 0 44%; width: 62%; }
.ill path, .ill circle, .ill ellipse, .ill rect { stroke: var(--pi); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.ill .s2 path, .ill .s2 circle, .ill .s2 ellipse, .ill .s2 rect { stroke-width: 4; }
.chip {
  font: 500 3.6cqi/1 var(--f-body); text-transform: uppercase; letter-spacing: .1em;
  color: var(--pi); background: var(--plate-line); padding: 1.6cqi 2.6cqi; border-radius: 99px;
}
.es { font: 800 11cqi/1.05 var(--f-display); letter-spacing: -.01em; text-wrap: balance; overflow-wrap: anywhere; }
.es .art { font-weight: 500; opacity: .55; }
.es .fem { font-weight: 500; }
.pl { font: 700 11.5cqi/1 var(--f-pen); color: var(--pen); text-wrap: balance; }
.ex { font: 400 4.4cqi/1.3 var(--f-body); font-style: italic; color: #5b5e66; }
.verb { font: 800 10cqi/1.05 var(--f-display); letter-spacing: -.01em; text-wrap: balance; overflow-wrap: anywhere; }
.verb .arrow { font-weight: 500; opacity: .5; }
.verb b { color: var(--pen); }
.side.back .verb { font-size: 8.5cqi; }
.gapq { font: 600 6.6cqi/1.3 var(--f-body); text-wrap: balance; }
.gapq .blank { display: inline-block; width: 18cqi; border-bottom: .6cqi solid var(--pi); margin: 0 1cqi; }
.expl { font: 700 6cqi/1.1 var(--f-pen); color: var(--pen); }
.say {
  position: absolute; top: 3.5cqi; right: 3.5cqi; width: 11cqi; height: 11cqi; min-width: 32px; min-height: 32px;
  border-radius: 50%; border: 1px solid var(--plate-line); background: var(--plate); color: var(--pi);
  display: grid; place-items: center; cursor: pointer; padding: 0;
}
.say svg { width: 55%; height: 55%; }
.hint { font-size: 12px; color: var(--muted); }

.progress { width: min(100%, 360px); display: grid; gap: 6px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress .bar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.actions { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; width: min(100%, 360px); }
.btn.no { color: var(--bad); }
.btn.yes { color: var(--good); }
kbd { font: 500 11px var(--f-body); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; color: var(--muted); }

.done { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px 22px; width: min(100%, 420px); text-align: center; display: grid; gap: 14px; }
.done h2 { font: 800 28px/1.1 var(--f-display); margin: 0; }
.done p { margin: 0; color: var(--muted); }
.done .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

/* ---- siatka ---- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.tile { aspect-ratio: 4 / 5; position: relative; }
.cell { display: grid; gap: 6px; min-width: 0; }
.cat { font: 500 11px/1.2 var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.cat::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--cat, var(--accent)); flex: none; }
.cat.l2cho { --cat: var(--e-green); }
.cat.l2ierto { --cat: var(--e-blue); }
.cat.l2uelto { --cat: var(--gold); }
.cat.l2to { --cat: var(--red); }
.cat.ropa { --cat: var(--e-blue); }
.cat.fisico { --cat: var(--gold); }
.cat.caracter { --cat: var(--red); }
.stage .cat { width: min(100%, 360px); margin-bottom: -8px; }
.tile .side { border-radius: 12px; }
.tile .known { position: absolute; top: 6px; left: 6px; z-index: 2; width: 10px; height: 10px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 2px var(--plate); }
.tile .say { display: none; }

/* ---- panel lekcji ---- */
.lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.lesson {
  font: inherit; text-align: left; text-decoration: none; color: var(--fg); background: var(--surface); cursor: pointer;
  border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; box-shadow: var(--shadow);
}
.lesson:hover { border-color: var(--accent); }
.lesson:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ill.thumb { aspect-ratio: 1; background: var(--plate); border: 1px solid var(--plate-line); border-radius: 10px; }
.ill.thumb svg { inset: 9%; width: 82%; height: 82%; }
.lesson .num { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.lesson h2 { font: 800 22px/1.15 var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.lesson .src { font-size: 13px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); }
.lesson .foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lesson .foot .prog { display: flex; align-items: center; gap: 10px; }
.lesson .go { color: var(--accent); font-weight: 700; }
.more { border: 1px dashed var(--line); border-radius: 16px; padding: 16px; color: var(--muted); font-size: 13px; display: grid; place-items: center; text-align: center; min-height: 140px; }
.sub .link { padding: 0; font-size: inherit; }
#source:empty { display: none; }

footer { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 12px; }

/* ---- quiz ---- */
.quizstage .card { width: min(100%, 290px); }
.quiz, .fb, #next { width: min(100%, 360px); }
.quiz { display: grid; gap: 8px; }
.qlabel { font-size: 13px; color: var(--muted); }
.qrow { display: flex; gap: 8px; }
.qrow input {
  flex: 1; min-width: 0; font: 500 18px/1.2 var(--f-body); padding: 11px 13px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
.qrow input:focus { outline: 3px solid var(--accent); outline-offset: 1px; }
.qrow input:disabled { opacity: .75; }
.chars { display: flex; flex-wrap: wrap; gap: 6px; }
.ch {
  font: 500 16px/1 var(--f-body); min-width: 40px; height: 40px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.fb { padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; gap: 4px; }
.fb.good { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--surface)); }
.fb.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--surface)); }
.fb .verdict { font-weight: 700; }
.fb.good .verdict { color: var(--good); }
.fb.bad .verdict { color: var(--bad); }
.fb small { color: var(--muted); }
.fb.info { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.fb.info .verdict { color: var(--accent); }
#dunno { width: 100%; }

@media (max-width: 520px) {
  .stat { margin-left: 0; width: 100%; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .quizstage .card { width: min(100%, 220px); }
  .grp { flex-direction: column; align-items: flex-start; gap: 4px; max-width: 100%; }
  .seg { flex-wrap: wrap; max-width: 100%; }
  .seg button { padding: 8px 9px; }
  .quizstage { gap: 12px; }
}
@media (prefers-reduced-motion: reduce) { .inner { transition: none; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Fiszki <span class="pen">Arriba Joven</span></h1>
      <p class="sub" id="sub"></p>
    </div>
    <nav class="decks" id="decks" aria-label="Talia"></nav>
  </header>

  <div class="toolbar" id="toolbar">
    <div class="grp"><span class="seg-label">Widok</span>
      <div class="seg" id="views">
        <button data-v="learn">Nauka</button>
        <button data-v="quiz">Quiz</button>
        <button data-v="all">Wszystkie</button>
      </div>
    </div>
    <div class="grp"><span class="seg-label" id="front-label">Na przodzie</span>
      <div class="seg" id="fronts"></div>
    </div>
    <button class="btn" id="shuffle" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
      Tasuj od nowa
    </button>
    <button class="btn" id="sound" type="button" aria-pressed="true"></button>
    <button class="btn" id="student" type="button"></button>
    <div class="stat" id="stat"></div>
  </div>

  <main id="main"></main>
  <section id="home" aria-label="Lekcje" hidden></section>

  <footer>
    <span id="source"></span>
    <a href="wyniki.html">Wyniki (dla rodzica)</a>
    <span>v1.11.0</span>
  </footer>
</div>

<script src="check.js?v=1.11.0"></script>
<script>
/* ===== rysowanie ===== */
const CL = 'var(--cl)', NS = 'stroke:none';
const P = (d, f = CL, st = '') => `<path d="${d}" style="fill:${f};${st}"/>`;
const L = (d, st = '') => P(d, 'none', st);
const C = (x, y, r, f = CL, st = '') => `<circle cx="${x}" cy="${y}" r="${r}" style="fill:${f};${st}"/>`;
const E = (x, y, rx, ry, f = CL, st = '') => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" style="fill:${f};${st}"/>`;
const R = (x, y, w, h, f = CL, st = '', rx = 0) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" style="fill:${f};${st}"/>`;
const TX = (x, y, t, size = 9, st = '') => `<text x="${x}" y="${y}" text-anchor="middle" style="font:700 ${size}px Lexend,system-ui,sans-serif;fill:var(--pi);${st}">${t}</text>`;
const M = s => `<g transform="translate(100 0) scale(-1 1)">${s}</g>`;
const T = (x, y, s, sc = 1, cls = '') => `<g class="${cls}" transform="translate(${x} ${y}) scale(${sc})">${s}</g>`;
const band = (d, w, col) => L(d, `stroke-width:${w + 2.4}`) + L(d, `stroke:${col};stroke-width:${w}`);
const svg = s => `<svg viewBox="0 0 100 100" aria-hidden="true">${s}</svg>`;
const STAR = (x, y, r) => P(`M${x} ${y - r} Q${x} ${y} ${x + r} ${y} Q${x} ${y} ${x} ${y + r} Q${x} ${y} ${x - r} ${y} Q${x} ${y} ${x} ${y - r} Z`, 'var(--gold)', 'stroke-width:1.2');
const HEART = (x, y, s = 1) => T(x, y, P('M0 4 C-7 -1 -6 -7 -2.6 -7 C-1 -7 0 -6 0 -4.6 C0 -6 1 -7 2.6 -7 C6 -7 7 -1 0 4 Z', 'var(--red)', 'stroke-width:1.3'), s);
const FLOWER = (x, y, r = 3, col = 'var(--pink)') =>
  [0, 72, 144, 216, 288].map(a => C(+(x + Math.cos(a * Math.PI / 180) * r).toFixed(2), +(y + Math.sin(a * Math.PI / 180) * r).toFixed(2), r * .8, col, 'stroke-width:1.2')).join('') + C(x, y, r * .55, 'var(--gold)', 'stroke-width:1.2');
const DROP = (x, y, s = 1) => T(x, y, P('M0 -6 Q5 2 0 4 Q-5 2 0 -6 Z', 'var(--e-light)', 'stroke-width:1.5'), s);
function bubble(x, y, w, h, text, tx, ty, size = 8.5) {
  const bx = Math.min(Math.max(tx, x + 6), x + w - 6);
  return P(`M${bx - 3.5} ${y + h - 1} L${tx} ${ty} L${bx + 3.5} ${y + h - 1} Z`, 'var(--eye-white)', 'stroke-width:1.6') +
    R(x, y, w, h, 'var(--eye-white)', 'stroke-width:1.6', 5) +
    L(`M${bx - 2.6} ${y + h} L${bx + 2.6} ${y + h}`, 'stroke:var(--eye-white);stroke-width:2.4') +
    TX(x + w / 2, y + h / 2 + size * .36, text, size);
}

/* ---- twarz ---- */
function hairBack(h, hc) {
  const curls = (pts, r) => pts.map(([x, y]) => C(x, y, r, hc, 'stroke-width:4.4')).join('') + pts.map(([x, y]) => C(x, y, r, hc, NS)).join('');
  switch (h) {
    case 'long': return P('M31 42 C28 20 72 20 69 42 L74 88 Q62 94 56 84 L44 84 Q38 94 26 88 Z', hc);
    case 'straight': return P('M30 40 C28 20 72 20 70 40 L72 94 L28 94 Z', hc);
    case 'wavy': return P('M31 40 C28 20 72 20 69 40 C74 52 66 60 72 70 C78 80 68 88 72 96 L28 96 C32 88 22 80 28 70 C34 60 26 52 31 40 Z', hc);
    case 'curly': return curls([[32, 32], [42, 24], [54, 22], [65, 27], [72, 38], [74, 51], [73, 64], [70, 76], [27, 38], [26, 51], [27, 64], [30, 76], [40, 84], [60, 84]], 9.5);
    case 'pony': return P('M62 32 C84 30 90 58 80 86 C78 66 72 52 60 42 Z', hc);
    case 'bun': return C(50, 21, 9, hc);

const OUTBOX = 'fiszki-outbox';
const outbox = {
  get() { try { return JSON.parse(localStorage.getItem(OUTBOX) || '[]'); } catch { return []; } },
  set(v) { try { localStorage.setItem(OUTBOX, JSON.stringify(v.slice(-500))); } catch { } },
};
let flushing = false;
async function flush() {
  if (flushing) return;
  flushing = true;
  try {
    let box = outbox.get();
    while (box.length) {
      let res;
      try {
        res = await fetch('api/answer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(box[0]), keepalive: true });
      } catch { break; }
      if (res.status === 429 || res.status >= 500) break;
      box = outbox.get().slice(1);
      outbox.set(box);
    }
  } finally { flushing = false; }
}
function meter(c, view, result, answer = '') {
  if (!st.student) return;
  outbox.set([...outbox.get(), {
    student: st.student, lesson: st.lesson, card: c.id, word: c.kind === 'verb' ? `${c.inf} → ${c.es}` : c.es, deck: st.deck, view, front: frontOf(c),
    answer: answer.slice(0, 200), result, session: st.session,
  }]);
  flush();
}

      <p>${missed ? `Umiesz ${n - missed} z ${n}. Zostało ${missed} do powtórki.` : `Wszystkie ${n} kart z tej rundy umiesz.`}</p>
      <div class="row">
        ${missed ? `<button class="btn" id="again-missed" type="button">Powtórz ${missed} trudne</button>` : ''}
        <button class="btn" id="again-all" type="button">Cała talia od nowa</button>
      </div></div></div>`;
    return;
  }
  const c = byId[st.queue[st.i]];
  $('#main').innerHTML = `<div class="stage">
    <div class="progress"><div style="display:flex;justify-content:space-between"><span>Karta ${st.i + 1} z ${n}</span></div><div class="bar"><i style="width:${st.i / n * 100}%"></i></div></div>
    ${catHTML(c)}
    <div class="card ${st.flipped ? 'flipped' : ''}" id="card" role="button" tabindex="0" aria-label="Odwróć kartę">
      <div class="inner">${sides(c)}</div>
    </div>
    <div class="actions">
      <button class="btn no" id="no" type="button">Jeszcze nie</button>
      <button class="btn" id="say" type="button" aria-label="Wymów po hiszpańsku">${SPEAKER.replace('<svg', '<svg width="18" height="18"')}</button>
      <button class="btn yes" id="yes" type="button">Umiem</button>
    </div>
    <div class="hint"><kbd>spacja</kbd> odwróć · <kbd>←</kbd> jeszcze nie · <kbd>→</kbd> umiem</div>
  </div>`;
}

function renderAll() {
  $('#main').innerHTML = `<div class="grid">${deck().cards.map(c => `<div class="cell">${catHTML(c)}
    <div class="tile ${st.flippedTiles.has(c.id) ? 'flipped' : ''}" data-id="${c.id}" role="button" tabindex="0" aria-label="${c.es}">
      ${st.known.has(c.id) ? '<span class="known" title="Umiesz"></span>' : ''}
      <div class="inner">${sides(c)}</div>
    </div></div>`).join('')}</div>`;
}

const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
const VERB_EXPECT = { inf: 'part', part: 'inf', gap: 'gap' };
const quizLang = c => c.kind === 'verb' ? VERB_EXPECT[frontOf(c)] : frontOf(c) === 'es' ? 'pl' : 'es';
const VERB_LABEL = { part: 'Napisz participio', inf: 'Napisz bezokolicznik', gap: 'Uzupełnij lukę (haber + participio)' };
function quizAnswer(c, lang) { if (c.kind === 'verb') return lang === 'inf' ? c.inf : lang === 'gap' ? c.gap.a : c.es; return lang === 'es' ? `${c.art ? c.art + ' ' : ''}${c.es}${c.esF ? ' / ' + c.esF : ''}` : c.pl; }
function renderQuiz() {
  if (!st.student || st.askName) return renderName();
  const n = st.queue.length;
  if (st.i >= n) return renderLearn();
  const c = byId[st.queue[st.i]], lang = quizLang(c), r = st.q, copy = st.qMode === 'copy';
  const good = st.i + (r || copy ? 1 : 0) - st.missed.length;
  const ans = `<b lang="${lang === 'pl' ? 'pl' : 'es'}">${esc(quizAnswer(c, lang))}</b>`;
  const msg = !r ? '' : r.copied ? ['Przepisane!', r.note === 'akcent' ? `Uważaj na akcent: ${ans}` : r.note === 'literowka' ? `Poprawna pisownia: ${ans}` : ans]
    : !r.ok && r.note === 'regular' ? ['Nie tym razem', `To forma regularna, a <b lang="es">${c.inf}</b> jest nieregularny: ${ans}`]
    : !r.ok && r.note === 'auxiliar' ? ['Prawie', `Participio dobrze, popraw „haber”: ${ans}`]
    : !r.ok ? ['Nie tym razem', `Poprawnie: ${ans}`]
    : r.note === 'akcent' ? ['Dobrze!', `Uważaj na akcent: ${ans}`]
    : r.note === 'literowka' ? ['Prawie dobrze!', `Poprawna pisownia: ${ans}`]
    : r.note === 'rodzajnik' ? ['Dobrze!', `Tylko rodzajnik: <b lang="es">${esc(c.art + ' ' + c.es)}</b>`]
    : ['Dobrze!', ans];
  $('#main').innerHTML = `<div class="stage quizstage">
    <div class="progress"><div style="display:flex;justify-content:space-between"><span>Pytanie ${st.i + 1} z ${n}</span><span>Dobrze: ${good}</span></div><div class="bar"><i style="width:${st.i / n * 100}%"></i></div></div>
    ${catHTML(c)}
    <div class="card ${r || copy ? 'flipped' : ''}" id="card" role="img" aria-label="Fiszka">
      <div class="inner">${sides(c)}</div>
    </div>
    <form class="quiz" id="quiz" autocomplete="off">
      <label class="qlabel" for="answer">${copy && !r ? 'Przepisz odpowiedź z karty' : VERB_LABEL[lang] || (lang === 'es' ? 'Napisz po hiszpańsku' : 'Napisz po polsku')}</label>
      <div class="qrow">
        <input id="answer" name="answer" type="text" lang="${lang === 'pl' ? 'pl' : 'es'}" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" value="${esc(st.qInput)}" ${r ? 'disabled' : ''}>
        <button class="btn primary" type="submit" ${r ? 'hidden' : ''}>Sprawdź</button>
      </div>
      ${lang !== 'pl' && !r ? `<div class="chars" aria-label="Litery hiszpańskie">${['á', 'é', 'í', 'ó', 'ú', 'ü', 'ñ', '¡', '¿'].map(ch => `<button class="ch" type="button" data-ch="${ch}">${ch}</button>`).join('')}</div>` : ''}
      ${!r && !copy ? '<button class="btn" id="dunno" type="button">Nie wiem - pokaż odpowiedź</button>' : ''}
    </form>
    ${copy && !r ? (st.qCopyErr
      ? '<div class="fb bad" role="status"><span class="verdict">To jeszcze nie to</span><span>Przepisz dokładnie to, co jest na karcie.</span></div>'
      : '<div class="fb info" role="status"><span class="verdict">Nie szkodzi</span><span>Przeczytaj kartę i przepisz odpowiedź.</span></div>') : ''}
    ${r ? `<div class="fb ${r.ok ? 'good' : 'bad'}" role="status"><span class="verdict">${msg[0]}</span><span>${msg[1]}</span>${!r.ok ? `<small>Twoja odpowiedź: ${esc(st.qInput)}</small>` : ''}${r.copied ? '<small>Ta karta wróci w powtórce.</small>' : ''}</div>
    <button class="btn primary" id="next" type="button">Dalej</button>` : ''}
  </div>`;
  (r ? $('#next') : $('#answer'))?.focus({ preventScroll: true });
  if (r) $('#next').scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}
function submitQuiz() {
  const c = byId[st.queue[st.i]], val = $('#answer').value;
  const r = c.kind === 'verb' ? FiszkiCheck.checkVerb(c, val, quizLang(c)) : FiszkiCheck.check(c, val, quizLang(c));
  if (!r) return $('#answer').focus();
  if (st.qMode === 'copy') {
    st.qInput = val;
    if (r.ok) st.q = { ...r, copied: true }; else st.qCopyErr = true;
    render();
    if (r.ok && quizLang(c) !== 'pl') say(c);
    return;
  }
  st.q = r; st.qInput = val;
  meter(c, 'quiz', r.ok ? r.note || 'dobrze' : ['regular', 'auxiliar'].includes(r.note) ? r.note : 'zle', val);
  if (r.ok) st.known.add(c.id); else { st.known.delete(c.id); st.missed.push(c.id); }
  persist(); render();
  if (quizLang(c) !== 'pl') say(c);
}
function nextQuiz() { st.i++; st.q = null; st.qInput = ''; st.qMode = 'ask'; st.qCopyErr = false; render(); }
function dontKnow() {
  const c = byId[st.queue[st.i]];
  st.qMode = 'copy'; st.qInput = ''; st.qCopyErr = false;
  meter(c, 'quiz', 'nie_wiem');
  st.known.delete(c.id); st.missed.push(c.id);
  persist(); render();
  if (quizLang(c) !== 'pl') say(c);
}

function renderHome() {
  $('#sub').textContent = 'Hiszpański. Wybierz lekcję.';
  $('#source').textContent = '';
  $('#home').innerHTML = `<div class="lessons">${LESSONS.map(l => {
    const cards = lessonCards(l), k = cards.filter(c => st.known.has(c.id)).length;
    return `<a class="lesson" href="#${l.id}" data-l="${l.id}">
      <div class="thumbs">${l.thumbs.map(id => `<div class="ill thumb">${pic(byId[id])}</div>`).join('')}</div>
      <span class="num">Lekcja ${l.n}</span>
      <h2>${l.title}</h2>
      <span class="src">${l.source}</span>
      <span class="chips">${l.decks.map(d => `<span lang="es">${d.name} · ${d.cards.length}</span>`).join('')}</span>
      <span class="foot"><span class="prog">Umiesz ${k} z ${cards.length}<span class="meter"><i style="width:${k / cards.length * 100}%"></i></span></span><span class="go">Otwórz lekcję →</span></span>
    </a>`;
  }).join('')}<div class="more">Kolejne lekcje pojawią się tutaj.</div></div>`;
}

function render() {
  const home = !st.lesson;
  $('#home').hidden = !home;
  $('#decks').hidden = $('#toolbar').hidden = $('#main').hidden = home;
  if (home) return renderHome();
  const l = lessonById(st.lesson);
  $('#sub').innerHTML = `<button class="link" id="home-btn" type="button">← Lekcje</button> · Lekcja ${l.n}: ${l.title}. Kliknij kartę, żeby ją odwrócić.`;
  $('#source').textContent = `Słówka: ${l.source}.`;
  ensureFront(); renderChrome(); ({ learn: renderLearn, quiz: renderQuiz, all: renderAll })[st.view]();
}
function openLesson(id) {
  const l = lessonById(id); if (!l) return;
  if (st.lesson !== id) { DECKS = decksOf(l); if (!DECKS.some(d => d.id === st.deck)) st.deck = DECKS[0].id; }
  st.lesson = id; ensureFront(); st.confirmReset = false; st.flippedTiles.clear();
  startRound(); persist(); render(); scrollTo(0, 0);
}

function flip() { st.flipped = !st.flipped; $('#card')?.classList.toggle('flipped', st.flipped); }
function answer(ok) {
  const id = st.queue[st.i]; if (!id) return;
  meter(byId[id], 'nauka', ok ? 'umiem' : 'nie_umiem');
  if (ok) st.known.add(id); else { st.known.delete(id); st.missed.push(id); }
  st.i++; st.flipped = false; persist(); render();
}

/* ===== zdarzenia ===== */
document.addEventListener('click', e => {
  const t = e.target.closest('button, .card, .tile, a[data-l]'); if (!t) return;
  if (t.dataset.l) { e.preventDefault(); return openLesson(t.dataset.l); }
  if (t.id === 'home-btn') { st.lesson = ''; persist(); try { speechSynthesis.cancel(); } catch { } return render(); }
  if (t.dataset.ch) {
    const a = $('#answer'), i = a.selectionStart ?? a.value.length, j = a.selectionEnd ?? i;
    a.value = a.value.slice(0, i) + t.dataset.ch + a.value.slice(j);
    a.focus(); a.setSelectionRange(i + 1, i + 1);
    return;
  }
  if (t.dataset.d) { st.deck = t.dataset.d; st.confirmReset = false; st.flippedTiles.clear(); startRound(); persist(); return render(); }
  if (t.dataset.v) { st.view = t.dataset.v; persist(); return render(); }
  if (t.dataset.f) { st.front = t.dataset.f; if (st.front === 'mix') shuffleMix(); st.flipped = false; st.flippedTiles.clear(); persist(); return render(); }
  switch (t.id) {
    case 'shuffle': st.flippedTiles.clear(); startRound(); return render();
    case 'card': return st.view === 'learn' ? flip() : undefined;
    case 'next': return nextQuiz();
    case 'dunno': return dontKnow();
    case 'reset': st.confirmReset = true; renderChrome(); return $('#reset-no')?.focus();
    case 'reset-no': st.confirmReset = false; return renderChrome();
    case 'reset-yes':
      deck().cards.forEach(c => st.known.delete(c.id));
      st.confirmReset = false; persist(); startRound(); return render();
    case 'yes': return answer(true);
    case 'no': return answer(false);
    case 'say': return say(byId[st.queue[st.i]], true);
    case 'student': st.askName = true; return render();
    case 'who-cancel': st.askName = false; return render();
    case 'who-logout':
      flush(); try { speechSynthesis.cancel(); } catch { }
      st.student = ''; st.known.clear(); st.askName = false; persist(); startRound(); return render();
    case 'sound':
      st.sound = !st.sound; persist();
      if (!st.sound) try { speechSynthesis.cancel(); } catch { }
      return renderChrome();
    case 'again-missed': startRound(st.missed); return render();
    case 'again-all': startRound(); return render();
  }
  if (t.classList.contains('tile')) {
    const id = t.dataset.id;
    st.flippedTiles.has(id) ? st.flippedTiles.delete(id) : st.flippedTiles.add(id);
    t.classList.toggle('flipped');
    if (st.flippedTiles.has(id)) say(byId[id]);
  }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'quiz') { e.preventDefault(); submitQuiz(); }
  if (e.target.id === 'who') {
    e.preventDefault();
    const name = $('#who-name').value.trim().slice(0, 40);
    if (!name) return $('#who-name').focus();
    if (name !== st.student) startRound();
    st.student = name; st.askName = false; persist(); render();
  }
});
document.addEventListener('keydown', e => {
  if (e.target.closest?.('.tile') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); return e.target.click(); }
  if (!st.lesson || st.view !== 'learn' || e.metaKey || e.ctrlKey || e.altKey || e.target.tagName === 'INPUT') return;
  if (e.target.tagName === 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
  else if (e.key === 'ArrowRight') answer(true);
  else if (e.key === 'ArrowLeft') answer(false);
});

startRound();
render();
flush();
</script>

</body>
</html>
