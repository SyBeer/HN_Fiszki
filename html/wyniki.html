<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Wyniki fiszek</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Lexend:wght@400;500;700&display=swap">
<style>
/* Layout: raport rodzica - wybór ucznia, kafelki podsumowania, rundy od najnowszej, najtrudniejsze słowa */
:root {
  --bg: #eceff5; --fg: #1b1e27; --muted: #5b6275; --surface: #ffffff; --line: #d3d8e3;
  --accent: #2747c9; --accent-fg: #ffffff; --good: #1d7f55; --bad: #b93b34; --warn: #a06a00;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Lexend", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14161b; --fg: #e7e9ef; --muted: #9aa1b3; --surface: #1f2229; --line: #343846;
    --accent: #8fa3ff; --accent-fg: #10142a; --good: #4cc490; --bad: #f07d74; --warn: #e5b04a; color-scheme: dark; }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--f-body);
  padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px));
}
[hidden] { display: none !important; }
.wrap { max-width: 900px; margin: 0 auto; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 10px; }
h1 { font: 800 clamp(26px, 6vw, 36px)/1 var(--f-display); margin: 0; letter-spacing: -.02em; }
h2 { font: 700 18px/1.2 var(--f-display); margin: 0; }
a { color: var(--accent); }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
select, input {
  font: 500 15px var(--f-body); padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); min-width: 0;
}
.btn {
  font: 500 14px/1 var(--f-body); border-radius: 10px; padding: 11px 14px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; }
.tile b { font: 800 26px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--muted); }
.muted { color: var(--muted); }
.err { color: var(--bad); }
.sessions { display: grid; gap: 10px; }
.session { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 8px; }
.shead { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; justify-content: space-between; }
.shead strong { font-weight: 700; }
.pill { font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 99px; background: var(--line); color: var(--fg); font-variant-numeric: tabular-nums; }
.pill.good { background: color-mix(in srgb, var(--good) 18%, var(--surface)); color: var(--good); }
.pill.mid { background: color-mix(in srgb, var(--warn) 18%, var(--surface)); color: var(--warn); }
.pill.bad { background: color-mix(in srgb, var(--bad) 16%, var(--surface)); color: var(--bad); }
.miss { margin: 0; padding-left: 18px; display: grid; gap: 2px; font-size: 14px; }
.miss em { color: var(--muted); }
.hard { width: 100%; border-collapse: collapse; font-size: 14px; }
.hard th, .hard td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.hard td.n, .hard th.n { text-align: right; font-variant-numeric: tabular-nums; }
footer { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Wyniki fiszek</h1>
      <p class="muted" style="margin:6px 0 0">Kto, kiedy i jak ćwiczył. Godziny w czasie lokalnym.</p>
    </div>
    <a href="./">Wróć do fiszek</a>
  </header>

  <form class="panel" id="login" hidden>
    <h2>Klucz rodzica</h2>
    <p class="muted" style="margin:0">Wpisz klucz raz, ta przeglądarka go zapamięta.</p>
    <div class="bar">
      <input id="token" type="password" autocomplete="current-password" aria-label="Klucz rodzica" style="flex:1">
      <button class="btn primary" type="submit">Pokaż wyniki</button>
    </div>
    <p class="err" id="login-err" hidden></p>
  </form>

  <section id="report" hidden>
    <div class="wrap" style="gap:16px">
      <div class="bar">
        <label for="who" class="muted">Uczeń</label>
        <select id="who"></select>
        <button class="btn" id="refresh" type="button">Odśwież</button>
        <button class="btn" id="logout" type="button">Wyloguj</button>
      </div>
      <div class="tiles" id="tiles"></div>
      <h2>Rundy</h2>
      <div class="sessions" id="sessions"></div>
      <h2>Najtrudniejsze słowa</h2>
      <div class="panel" style="overflow-x:auto"><table class="hard" id="hard"></table></div>
    </div>
  </section>

  <footer>Fiszki Arriba Joven · wyniki z serwera · v1.8.0</footer>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const KEY = 'fiszki-admin';
const tok = { get() { try { return localStorage.getItem(KEY) || ''; } catch { return ''; } }, set(v) { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch { } } };
const DECK = { ropa: 'La ropa', fisico: 'Descripción física', caracter: 'Carácter', todo: 'Wszystko' };
const GOOD = new Set(['dobrze', 'akcent', 'literowka', 'rodzajnik', 'umiem']);
const LABEL = { zle: 'źle', nie_wiem: 'nie wiem', nie_umiem: 'jeszcze nie', akcent: 'bez akcentu', literowka: 'literówka', rodzajnik: 'zły rodzajnik' };
let rows = [], token = tok.get();

const fmtDay = d => d.toLocaleDateString('pl-PL', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtTime = d => d.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const pillCls = p => p >= 80 ? 'good' : p >= 50 ? 'mid' : 'bad';

async function load() {
  if (!token) return showLogin();
  let res;
  try { res = await fetch('api/results', { headers: { 'X-Admin-Token': token }, cache: 'no-store' }); }
  catch { return showLogin('Brak połączenia z serwerem.'); }
  if (res.status === 401) { tok.set(''); token = ''; return showLogin('Zły klucz. Wpisz go jeszcze raz.'); }
  if (!res.ok) return showLogin('Serwer nie zwrócił wyników (' + res.status + ').');
  rows = (await res.json()).rows.map(r => ({ ...r, d: new Date(r.ts) }));
  $('#login').hidden = true; $('#report').hidden = false;
  const students = [...new Set(rows.map(r => r.student))];
  const cur = $('#who').value;
  $('#who').innerHTML = students.length ? students.map(s => `<option>${esc(s)}</option>`).join('') : '<option value="">(brak wyników)</option>';
  if (students.includes(cur)) $('#who').value = cur;
  render();
}

function showLogin(msg) {
  $('#report').hidden = true; $('#login').hidden = false;
  $('#login-err').hidden = !msg; $('#login-err').textContent = msg || '';
  $('#token').focus();
}

function render() {
  const who = $('#who').value;
  const mine = rows.filter(r => r.student === who);
  const quiz = mine.filter(r => r.view === 'quiz');
  const today = new Date().toDateString();
  const todays = mine.filter(r => r.d.toDateString() === today);
  const last = mine[0];
  $('#tiles').innerHTML = [
    [last ? `${fmtDay(last.d)}, ${fmtTime(last.d)}` : '-', 'ostatnie ćwiczenie'],
    [todays.length, 'odpowiedzi dzisiaj'],
    [quiz.length ? pct(quiz.filter(r => GOOD.has(r.result)).length, quiz.length) + '%' : '-', 'dobrze w quizie (wszystkie)'],
    [new Set(mine.filter(r => GOOD.has(r.result)).map(r => r.card)).size, 'różnych słów trafionych'],
  ].map(([v, l]) => `<div class="tile"><b>${v}</b><span>${l}</span></div>`).join('');

  const sessions = new Map();
  for (const r of mine) (sessions.get(r.session) || sessions.set(r.session, []).get(r.session)).push(r);
  $('#sessions').innerHTML = [...sessions.values()].map(list => {
    list = [...list].reverse();
    const first = list[0].d, end = list[list.length - 1].d;
    const good = list.filter(r => GOOD.has(r.result)).length, p = pct(good, list.length);
    const view = [...new Set(list.map(r => r.view === 'quiz' ? 'Quiz' : 'Nauka'))].join(' + ');
    const misses = list.filter(r => r.result !== 'dobrze' && r.result !== 'umiem');
    return `<article class="session">
      <div class="shead"><strong>${fmtDay(first)}, ${fmtTime(first)}–${fmtTime(end)}</strong>
        <span class="muted">${esc(DECK[list[0].deck] || list[0].deck)} · ${view} · ${list.length} odp.</span>
        <span class="pill ${pillCls(p)}">${good} z ${list.length} dobrze (${p}%)</span></div>
      ${misses.length ? `<ul class="miss">${misses.map(r => `<li><b lang="es">${esc(r.word)}</b> - ${LABEL[r.result] || r.result}${r.answer && r.result !== 'nie_wiem' ? ` <em>(wpisane: ${esc(r.answer)})</em>` : ''}</li>`).join('')}</ul>` : '<span class="muted">Bez błędów.</span>'}
    </article>`;
  }).join('') || '<p class="muted">Ten uczeń nie ma jeszcze wyników.</p>';

  const hard = new Map();
  for (const r of mine) {
    const h = hard.get(r.card) || { word: r.word, bad: 0, all: 0 };
    h.all++; if (!GOOD.has(r.result)) h.bad++;
    hard.set(r.card, h);
  }
  const top = [...hard.values()].filter(h => h.bad).sort((a, b) => b.bad - a.bad || b.bad / b.all - a.bad / a.all).slice(0, 12);
  $('#hard').innerHTML = top.length
    ? `<thead><tr><th>Słowo</th><th class="n">Błędy</th><th class="n">Próby</th></tr></thead><tbody>${top.map(h => `<tr><td lang="es">${esc(h.word)}</td><td class="n">${h.bad}</td><td class="n">${h.all}</td></tr>`).join('')}</tbody>`
    : '<tbody><tr><td class="muted">Brak błędów.</td></tr></tbody>';
}

$('#login').addEventListener('submit', e => { e.preventDefault(); token = $('#token').value.trim(); tok.set(token); load(); });
$('#who').addEventListener('change', render);
$('#refresh').addEventListener('click', load);
$('#logout').addEventListener('click', () => { tok.set(''); token = ''; showLogin(); });
load();
</script>
</body>
</html>
