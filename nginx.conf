server {
    listen 80;
    root /usr/share/nginx/html;
    charset utf-8;

    # Za Caddy (HTTPS na VPS) $remote_addr to adres proxy, nie ucznia.
    # Prawdziwe IP z X-Forwarded-For, ale tylko od proxy z sieci prywatnej/lokalnej
    # (port 8085 słucha wyłącznie na 127.0.0.1, z internetu wchodzi się tylko przez Caddy).
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    location /api/ {
        proxy_pass http://results:8000;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 8k;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
